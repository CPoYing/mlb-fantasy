{% extends "base.html" %}
{% block content %}
<div class="tab-bar">
    <a href="{{ url_for('team', league_key=league_key) }}" class="btn btn-outline">我的隊伍</a>
    <a href="{{ url_for('matchup', league_key=league_key) }}" class="btn btn-outline">對戰分析</a>
    <a href="{{ url_for('free_agents', league_key=league_key) }}" class="btn btn-primary">自由球員</a>
    <a href="{{ url_for('trades', league_key=league_key) }}" class="btn btn-outline">交易建議</a>
</div>

<div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h2>自由球員推薦</h2>
        <form method="get">
            <select name="position" onchange="this.form.submit()">
                <option value="B" {% if position=='B' %}selected{% endif %}>打者</option>
                <option value="SP" {% if position=='SP' %}selected{% endif %}>先發投手</option>
                <option value="RP" {% if position=='RP' %}selected{% endif %}>後援投手</option>
            </select>
        </form>
    </div>

    {% if players %}
    <table>
        <thead>
            <tr><th>#</th><th>球員</th><th>位置</th><th>球隊</th><th>擁有率</th></tr>
        </thead>
        <tbody>
        {% for p in players %}
        <tr>
            <td style="color:#555">{{ loop.index }}</td>
            <td>{{ p.name }}</td>
            <td><span class="badge badge-purple">{{ p.position }}</span></td>
            <td>{{ p.team }}</td>
            <td>
                <div style="display:flex;align-items:center;gap:8px">
                    <div style="background:#2a2a4a;border-radius:4px;height:6px;width:80px;overflow:hidden">
                        <div style="background:#6001d2;height:100%;width:{{ p.percent_owned }}%"></div>
                    </div>
                    {{ p.percent_owned }}%
                </div>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    {% else %}
    <div class="empty">找不到自由球員</div>
    {% endif %}
</div>
{% endblock %}
