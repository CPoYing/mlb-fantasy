{% extends "base.html" %}
{% block title %}球員排名{% endblock %}
{% block content %}

<style>
.pos-tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.pos-tab {
    padding: 6px 14px;
    border: 1px solid var(--line-strong);
    background: var(--card);
    color: var(--ink);
    border-radius: var(--radius);
    cursor: pointer;
    font-family: var(--font-display);
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}
.pos-tab:hover { background: var(--paper-deep); }
.pos-tab.active { background: var(--red); color: var(--paper); border-color: var(--red); }
#rnk-table th { cursor: pointer; user-select: none; }
#rnk-table th.sorted-asc::after  { content: " ▲"; color: var(--gold); }
#rnk-table th.sorted-desc::after { content: " ▼"; color: var(--gold); }
.name-cell { text-align: left !important; max-width: 220px; }
</style>

<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
        <div class="spinner"></div>
        <div>正在載入全聯盟球員排名...</div>
        <div class="hint" style="margin-top:6px">首次載入約需 15–25 秒（要抓 ~1500 位球員的整季數據）</div>
    </div>
</div>

<div class="card">
    <div class="section-title-row">
        <h2 class="section-title" style="border:0;padding:0">球員排名 · 5×5 Z-score</h2>
        <span class="section-meta" id="rnk-count"></span>
    </div>

    <div class="pos-tabs" id="pos-tabs">
        <button class="pos-tab active" data-pos="ALL">全部</button>
        <button class="pos-tab" data-pos="C">C</button>
        <button class="pos-tab" data-pos="1B">1B</button>
        <button class="pos-tab" data-pos="2B">2B</button>
        <button class="pos-tab" data-pos="3B">3B</button>
        <button class="pos-tab" data-pos="SS">SS</button>
        <button class="pos-tab" data-pos="OF">OF</button>
        <button class="pos-tab" data-pos="SP">SP</button>
        <button class="pos-tab" data-pos="RP">RP</button>
    </div>

    <div class="tbl-wrap" id="rnk-wrap" style="display:none">
        <table id="rnk-table">
            <thead><tr id="rnk-thead-row"></tr></thead>
            <tbody id="rnk-tbody"></tbody>
        </table>
    </div>
</div>

<script>
const BATTING_CATS  = ['R','HR','RBI','SB','AVG'];
const PITCHING_CATS = ['W','SV','K','ERA','WHIP'];
const PITCHER_POS   = new Set(['SP','RP']);

let allPlayers = [];
let currentPos = 'ALL';
let sortCol    = 'rank';
let sortAsc    = true;

async function loadData() {
    try {
        const r = await fetch('/api/rankings/{{ league_key }}');
        const d = await r.json();
        if (d.error) { alert('錯誤: ' + d.error); return; }
        allPlayers = d.players;
        document.getElementById('loadingOverlay').style.display = 'none';
        document.getElementById('rnk-wrap').style.display = 'block';
        render();
    } catch (e) {
        alert('載入失敗: ' + e);
    }
}

function filtered() {
    let list = allPlayers;
    if (currentPos !== 'ALL') {
        list = list.filter(p => (p.eligible_positions || []).includes(currentPos));
    }
    return sortList(list);
}
function sortList(list) {
    return [...list].sort((a, b) => {
        let av = colVal(a, sortCol);
        let bv = colVal(b, sortCol);
        if (av === null && bv === null) return 0;
        if (av === null) return 1;
        if (bv === null) return -1;
        return sortAsc ? (av - bv) : (bv - av);
    });
}
function colVal(p, col) {
    if (col === 'rank')    return p.rank;
    if (col === 'z_score') return p.z_score;
    const z = p.cats[col];
    return (z !== undefined && z !== null) ? z : null;
}

function getCols(pos) {
    if (PITCHER_POS.has(pos)) return { bat: [], pit: PITCHING_CATS };
    if (pos === 'ALL')        return { bat: BATTING_CATS, pit: PITCHING_CATS };
    return { bat: BATTING_CATS, pit: [] };
}

function zClass(z) {
    if (z === null || z === undefined) return 'z-neu';
    if (z >= 1.5)  return 'z-pos-2';
    if (z >= 0.5)  return 'z-pos-1';
    if (z >= -0.5) return 'z-neu';
    if (z >= -1.5) return 'z-neg-1';
    return 'z-neg-2';
}
function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function render() {
    const pos   = currentPos;
    const cols  = getCols(pos);
    const full  = filtered();
    const limit = pos === 'ALL' ? 100 : 50;
    const list  = full.slice(0, limit);
    document.getElementById('rnk-count').textContent = `${pos === 'ALL' ? '全部' : pos} · 顯示 ${list.length} / ${full.length} 人`;

    const fixedCols = [
        { key: 'rank',    label: 'SYS' },
        { key: 'name',    label: '球員',   nosort: true },
        { key: 'pos',     label: '位置',   nosort: true },
        { key: 'z_score', label: 'Z 總' },
    ];
    const catCols = [...cols.bat, ...cols.pit].map(c => ({ key: c, label: c }));
    const allCols = [...fixedCols, ...catCols];

    const headRow = document.getElementById('rnk-thead-row');
    headRow.innerHTML = allCols.map(c => {
        if (c.nosort) return `<th>${c.label}</th>`;
        const cls = sortCol === c.key ? (sortAsc ? 'sorted-asc' : 'sorted-desc') : '';
        return `<th class="${cls}" data-col="${c.key}">${c.label}</th>`;
    }).join('');

    headRow.querySelectorAll('th[data-col]').forEach(th => {
        th.addEventListener('click', () => {
            const col = th.dataset.col;
            if (sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = (col === 'rank'); }
            render();
        });
    });

    const tbody = document.getElementById('rnk-tbody');
    tbody.innerHTML = list.map((p, i) => {
        const localRank = i + 1;
        const ep = (p.eligible_positions || [])
            .filter(x => !['BN', 'IL', 'Util'].includes(x))
            .slice(0, 3)
            .map(x => `<span class="pos-chip">${x}</span>`)
            .join(' ');

        const catCells = [...cols.bat, ...cols.pit].map(cat => {
            const z = p.cats[cat];
            if (z === undefined || z === null) return '<td class="num z-neu">—</td>';
            return `<td class="num ${zClass(z)}">${z.toFixed(2)}</td>`;
        }).join('');

        return `<tr>
            <td class="num" style="color:var(--red);font-weight:700">${localRank}</td>
            <td class="name-cell"><span class="player-name">${esc(p.name)}</span></td>
            <td><div class="pos-chips">${ep}</div></td>
            <td class="num ${zClass(p.z_score)}">${p.z_score.toFixed(2)}</td>
            ${catCells}
        </tr>`;
    }).join('');
}

document.getElementById('pos-tabs').addEventListener('click', e => {
    const btn = e.target.closest('.pos-tab');
    if (!btn) return;
    document.querySelectorAll('.pos-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentPos = btn.dataset.pos;
    sortCol = 'rank';
    sortAsc = true;
    render();
});

loadData();
</script>

{% endblock %}
